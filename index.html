<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#168bd0">
  <meta name="description" content="Letterheld: spelenderwijs letters, cijfers, rekenen, woorden en klanken oefenen.">
  <title>Letterheld</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="welcome" class="center"></div>
  <div id="app" class="hide">
    <header><div class="bar">
      <button id="brand" class="brand" type="button" aria-label="Naar startscherm">⭐ Letterheld</button>
      <div class="header-actions">
        <button id="back" class="icon-button hide" type="button" aria-label="Terug">←</button>
        <button id="home" class="icon-button hide" type="button" aria-label="Startscherm">🏠</button>
        <button id="settings" class="icon-button" type="button" aria-label="Instellingen">⚙️</button>
        <span class="pill"><span id="sym">🚜</span> ⭐ <span id="stars">0</span></span>
      </div>
    </div></header>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
