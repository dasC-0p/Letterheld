<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letterheld</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(#dff4ff,#fff,#fff2c9);color:#234;min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer}.hide{display:none!important}.center{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}h1{font-size:clamp(34px,7vw,56px);margin:10px}.name{padding:15px;border:3px solid #57bdea;border-radius:16px;text-align:center;font-size:22px;font-weight:bold}.symbols,.games,.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px auto;max-width:800px}.symbol,.tile,.item{background:white;border-radius:22px;padding:16px;box-shadow:0 8px 22px #0002}.symbol span,.tile span,.item span{display:block;font-size:50px}.symbol.sel{outline:5px solid #1da6e5}.primary{background:#168bd0;color:white;padding:13px 21px;border-radius:16px;font-weight:900}.primary:disabled{opacity:.35}header{position:sticky;top:0;background:#fffd;z-index:5;border-bottom:1px solid #bde4f7}.bar{max-width:1050px;margin:auto;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}.brand{background:none;color:#0875b4;font-weight:900;font-size:22px}.pill{background:#ffefa5;padding:9px 12px;border-radius:99px;font-weight:900}main{max-width:1050px;margin:auto;padding:24px 15px 45px}.hero{display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:clamp(38px,7vw,62px)}.hero em{color:#168bd0;font-style:normal}.friend{font-size:130px}.homegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.homecard,.tile{min-height:170px;border-radius:26px;color:white;padding:22px;text-align:left;box-shadow:0 8px 22px #0002}.homecard span{font-size:55px}.c0{background:#f25f7d}.c1{background:#f2b51e}.c2{background:#20b887}.c3{background:#28a5dd}.c4{background:#9465e7}.c5{background:#ef7b35}.title{text-align:center}.title .ico{font-size:58px}.panel{background:white;border-radius:27px;padding:24px;text-align:center;box-shadow:0 8px 24px #0002}.alphabet{display:grid;grid-template-columns:.7fr 1.3fr;gap:16px}.big{font-size:140px;color:#168bd0;background:none;font-weight:900}.example{font-size:70px}.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;align-content:start}.letter,.answer{aspect-ratio:1;border-radius:16px;color:white;font-size:29px;font-weight:900}.chosen{outline:5px solid #86d6fa;filter:brightness(.8)}.instruction{display:flex;justify-content:center;align-items:center;gap:12px}.speak{width:52px;height:52px;border-radius:50%;background:#168bd0;color:white;font-size:23px}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:760px;margin:22px auto}.answer{font-size:58px;border-radius:24px}.answer:disabled{opacity:.5}.feedback{margin-top:18px;padding:17px;border-radius:19px;font-size:20px;font-weight:900}.good{background:#d4f8e8;color:#08784e}.bad{background:#fff0b2;color:#966000}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:650px;margin:auto}.memory button{aspect-ratio:1;border-radius:22px;background:#8759d9;color:white;font-size:40px;font-weight:900}.memory .open{background:white;color:#7041bd}.item{text-align:center}.item button{background:#f2b51e;padding:10px;border-radius:12px;font-weight:900}.owned{background:#d4f8e8;padding:7px;border-radius:10px;font-weight:900}.collection{text-align:center;font-size:45px}.confetti{position:fixed;inset:0;pointer-events:none}.confetti i{position:absolute;top:-40px;font-size:38px;animation:f 1.7s forwards}@keyframes f{to{transform:translateY(110vh) rotate(420deg);opacity:0}}@media(max-width:720px){.symbols,.games,.shop{grid-template-columns:repeat(2,1fr)}.homegrid,.alphabet{grid-template-columns:1fr}.friend{display:none}.letters{grid-template-columns:repeat(5,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.memory{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="welcome" class="center"></div><div id="app" class="hide"><header><div class="bar"><button id="brand" class="brand">⭐ Letterheld</button><div><button id="home" class="primary hide">🏠</button> <span class="pill"><span id="sym">🚜</span> ⭐ <span id="stars">0</span></span></div></div></header><main id="main"></main></div><script>
const Store=(()=>{let m={},ok=false;try{localStorage.setItem('_x','1');localStorage.removeItem('_x');ok=true}catch(e){}return{get(k,d){try{if(ok)return localStorage.getItem(k)??d}catch(e){}return k in m?m[k]:d},set(k,v){try{if(ok){localStorage.setItem(k,v);return}}catch(e){}m[k]=String(v)},del(k){try{if(ok)localStorage.removeItem(k)}catch(e){}delete m[k]}}})();
const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),C=['c0','c1','c2','c3','c4','c5'];const SYMBOLS=[['🚜','Traktor'],['🍐','Peer'],['🦁','Leeuw'],['🦕','Dino'],['🐵','Aap'],['🚒','Brandweer'],['🚀','Raket'],['⚽','Voetbal']];const DATA=[['A','AAP','🐵'],['B','BEER','🐻'],['C','CITROEN','🍋'],['D','DINO','🦕'],['E','EEND','🦆'],['F','FIETS','🚲'],['G','GEIT','🐐'],['H','HOND','🐶'],['I','IJS','🍦'],['J','JAS','🧥'],['K','KAT','🐱'],['L','LEEUW','🦁'],['M','MUIS','🐭'],['N','NOOT','🌰'],['O','OLIFANT','🐘'],['P','PAARD','🐴'],['Q','QUICHE','🥧'],['R','ROOS','🌹'],['S','SLANG','🐍'],['T','TREIN','🚂'],['U','UIL','🦉'],['V','VIS','🐟'],['W','WOLK','☁️'],['X','XYLOFOON','🎵'],['Y','YOGHURT','🥣'],['Z','ZEBRA','🦓']].map(x=>({l:x[0],w:x[1],e:x[2]}));const SOUND={A:'aaaaa',B:'buh',C:'kuh',D:'duh',E:'eeeee',F:'fffff',G:'guh',H:'hhhhh',I:'iiiii',J:'jjjjj',K:'kuh',L:'lllll',M:'mmmmm',N:'nnnnn',O:'ooooo',P:'puh',Q:'kuu',R:'rrrrr',S:'sssss',T:'tuh',U:'uuuuu',V:'vvvvv',W:'weeee',X:'iks',Y:'ij',Z:'zzzzz'};const REW=[['🌈','Regenboog',5],['🎈','Ballon',8],['👑','Kroon',12],['🚀','Raket',15],['🦖','Dinoschat',20],['🏆','Trofee',25]];
let S={screen:'home',name:Store.get('name',''),symbol:JSON.parse(Store.get('symbol','null')),stars:+Store.get('stars','0'),owned:JSON.parse(Store.get('owned','[]')),round:0,selected:'E',feedback:null,memory:null};const $=q=>document.querySelector(q),main=$('#main');function speak(t,slow=false){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='nl-BE';u.rate=slow?.68:.88;speechSynthesis.speak(u)}function save(){Store.set('name',S.name);Store.set('symbol',JSON.stringify(S.symbol));Store.set('stars',S.stars);Store.set('owned',JSON.stringify(S.owned));status()}function status(){$('#stars').textContent=S.stars;if(S.symbol)$('#sym').textContent=S.symbol[0];$('#home').classList.toggle('hide',S.screen==='home')}function sh(a){return[...a].sort(()=>Math.random()-.5)}function opts(x,p){return sh([x,...sh(p.filter(y=>y!==x)).slice(0,3)])}function title(i,t,p){return`<div class="title"><div class="ico">${i}</div><h1>${t}</h1><p>${p}</p></div>`}function confetti(){let d=document.createElement('div');d.className='confetti';['⭐','✨','🎉','🌈'].forEach((x,i)=>{let z=document.createElement('i');z.textContent=x;z.style.left=(15+i*22)+'vw';z.style.animationDelay=i*.08+'s';d.append(z)});document.body.append(d);setTimeout(()=>d.remove(),1900)}
function welcome(){if(S.name&&S.symbol){$('#welcome').classList.add('hide');$('#app').classList.remove('hide');render();return}$('#welcome').classList.remove('hide');$('#app').classList.add('hide');$('#welcome').innerHTML=`<div><div style="font-size:70px">👋</div><h1>Hallo!</h1><p>Hoe heet jij?</p><input id="nm" class="name" maxlength="20" placeholder="Typ je naam" value="${S.name}"><p>Kies jouw symbool.</p><div class="symbols">${SYMBOLS.map((x,i)=>`<button data-sym="${i}" class="symbol ${S.symbol?.[1]===x[1]?'sel':''}"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div><button id="go" class="primary" ${!(S.name&&S.symbol)?'disabled':''}>Start mijn avontuur</button></div>`}function render(){status();main.innerHTML=page();if(['listen','case'].includes(S.screen)&&!S.feedback)setTimeout(()=>speak(S.current.say,true),250)}function page(){return S.screen==='home'?home():S.screen==='alphabet'?alphabet():S.screen==='games'?games():S.screen==='find'?quiz(false):S.screen==='listen'?quiz(true):S.screen==='case'?caseGame():S.screen==='animal'?animal():S.screen==='memory'?memory():shop()}
function home(){return`<div class="hero"><h1>Hallo ${S.name}! Word jij een <em>Letterheld?</em></h1><div class="friend">${S.symbol[0]}</div></div><div class="homegrid">${[['alphabet','🔤','Letters ontdekken','c3'],['games','🎮','Spelletjes','c2'],['shop','🎁','Sterrenwinkel','c5']].map(x=>`<button data-screen="${x[0]}" class="homecard ${x[3]}"><span>${x[1]}</span><h2>${x[2]}</h2></button>`).join('')}</div>`}function alphabet(){let x=DATA.find(d=>d.l===S.selected);return title('🔤','Ontdek letters','Klik op de grote letter voor de klank.')+`<div class="alphabet"><div class="panel"><button class="big" data-act="sound">${x.l}</button><div class="example">${x.e}</div><h2>${x.w.toLowerCase()}</h2><button class="primary" data-act="example">🔊 Dit is de ${x.l} van ${x.w.toLowerCase()}</button></div><div class="letters">${L.map((l,i)=>`<button data-letter="${l}" class="letter ${C[i%6]} ${l===S.selected?'chosen':''}">${l}</button>`).join('')}</div></div>`}function games(){let g=[['find','🔎','Vind de letter'],['listen','👂','Luisterspel'],['case','🔠','Groot of klein'],['animal','🐾','Zoek het dier'],['memory','🧠','Lettermemory'],['shop','🎁','Sterrenwinkel']];return title('🎮','Kies een spel','Tik op een spel.')+`<div class="games">${g.map((x,i)=>`<button data-screen="${x[0]}" class="tile ${C[i]}"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div>`}function shell(i,t,q,a){return title(i,t,'Een goed antwoord verdient een ster.')+`<div class="panel"><div class="instruction"><h2>${q}</h2><button data-act="repeat" class="speak">🔊</button></div><div class="answers">${a}</div>${feed()}</div>`}function ans(x,i,id=x){return`<button data-answer="${id}" class="answer ${C[i]}" ${S.feedback?'disabled':''}>${x}</button>`}function quiz(listen){let x=L[(S.round*(listen?3:1)+(listen?4:0))%26];S.current={target:x,say:listen?SOUND[x]:'Zoek de letter '+x};return shell(listen?'👂':'🔎',listen?'Luisterspel':'Vind de letter',listen?'Welke letterklank hoor je?':'Waar staat de '+x+'?',opts(x,L).map((v,i)=>ans(v,i)).join(''))}function caseGame(){let u=L[(S.round*5+2)%26],upper=S.round%2===0,x=upper?u:u.toLowerCase(),pool=L.map(v=>upper?v:v.toLowerCase());S.current={target:x,say:upper?'Tik op de grote '+u:'Tik op de kleine '+u.toLowerCase()};return shell('🔠','Groot of klein',S.current.say,opts(x,pool).map((v,i)=>ans(v,i)).join(''))}function animal(){let a=DATA.filter(x=>'🐵🐻🦕🦆🐐🐶🐱🦁🐭🐘🐴🐍🦉🐟🦓'.includes(x.e)),x=a[S.round%a.length];S.current={target:x.w,say:'Tik op '+x.w.toLowerCase()};return shell('🐾','Zoek het dier',S.current.say,opts(x,a).map((v,i)=>ans(v.e,i,v.w)).join(''))}
function initMem(){let b=['A','B','K','M','S','V'];S.memory={c:sh([...b,...b].map((l,i)=>({l,i}))),o:[],d:[],busy:false,won:false}}function memory(){if(!S.memory)initMem();let m=S.memory;return title('🧠','Lettermemory','Zoek twee dezelfde letters.')+`<div class="memory">${m.c.map(x=>{let o=m.o.includes(x.i)||m.d.includes(x.i);return`<button data-mid="${x.i}" class="${o?'open':''}">${o?x.l:'★'}</button>`}).join('')}</div>${m.won?`<div class="panel"><h2>Goed gedaan, ${S.name}!</h2></div>`:''}`}function shop(){return title('🎁',S.name+"'s sterrenwinkel",'Wissel sterren in voor iets leuks.')+(S.owned.length?`<div class="collection">${S.owned.map(i=>REW[i][0]).join(' ')}</div>`:'')+`<div class="shop">${REW.map((r,i)=>`<div class="item"><span>${r[0]}</span><h3>${r[1]}</h3><p>⭐ ${r[2]}</p>${S.owned.includes(i)?'<b class="owned">Verzameld!</b>':`<button data-buy="${i}" ${S.stars<r[2]?'disabled':''}>Omwisselen</button>`}</div>`).join('')}</div><div class="panel" style="margin-top:18px"><button data-act="profile" class="primary">Naam of symbool wijzigen</button></div>`}function feed(){return S.feedback?`<div class="feedback ${S.feedback==='good'?'good':'bad'}">${S.feedback==='good'?'✅ Goed gedaan, '+S.name+'! +1 ster':'❌ Bijna, '+S.name+'!'}<br><button data-act="next" class="primary">Volgende</button></div>`:''}function reward(){S.stars++;S.feedback='good';save();speak('Goed gedaan '+S.name);confetti();render()}function miss(){S.feedback='bad';speak('Bijna '+S.name);render()}
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value.trim();$('#go').disabled=!(S.name&&S.symbol)}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.sym!==undefined){S.symbol=SYMBOLS[+b.dataset.sym];S.name=$('#nm').value.trim();welcome();return}if(b.id==='go'){if(!S.symbol)return;S.name=$('#nm').value.trim()||'Letterheld';save();speak('Welkom '+S.name);welcome();return}if(b.dataset.screen){S.screen=b.dataset.screen;S.feedback=null;render();return}if(b.dataset.letter){S.selected=b.dataset.letter;let x=DATA.find(d=>d.l===S.selected);speak('Dit is de '+x.l+' van '+x.w.toLowerCase(),true);render();return}if(b.dataset.answer!==undefined){b.dataset.answer===String(S.current.target)?reward():miss();return}if(b.dataset.mid!==undefined){flip(+b.dataset.mid);return}if(b.dataset.buy!==undefined){let i=+b.dataset.buy,r=REW[i];if(S.stars>=r[2]){S.stars-=r[2];S.owned.push(i);save();confetti();render()}return}switch(b.dataset.act){case'sound':speak(SOUND[S.selected],true);break;case'example':{let x=DATA.find(d=>d.l===S.selected);speak('Dit is de '+x.l+' van '+x.w.toLowerCase(),true);break}case'repeat':speak(S.current.say,true);break;case'next':S.round++;S.feedback=null;render();break;case'profile':Store.del('name');Store.del('symbol');S.name='';S.symbol=null;welcome();break}});function flip(id){let m=S.memory;if(m.busy||m.o.includes(id)||m.d.includes(id)||m.won)return;m.o.push(id);render();if(m.o.length===2){m.busy=true;let a=m.c.find(x=>x.i===m.o[0]),b=m.c.find(x=>x.i===m.o[1]);setTimeout(()=>{if(a.l===b.l)m.d.push(a.i,b.i);m.o=[];m.busy=false;if(m.d.length===m.c.length){m.won=true;S.stars++;save();speak('Goed gedaan '+S.name);confetti()}render()},a.l===b.l?400:800)}}$('#brand').onclick=$('#home').onclick=()=>{S.screen='home';S.feedback=null;render()};welcome();
</script></body></html>
