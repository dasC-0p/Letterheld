<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letterheld</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#24324a;background:linear-gradient(#def4ff,#fff,#fff1c8);min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer}.hide{display:none!important}.center{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}h1{font-size:clamp(34px,7vw,56px);margin:10px}.name{padding:15px;border:3px solid #57bdea;border-radius:16px;text-align:center;font-size:22px;font-weight:bold}.symbols,.menu,.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px auto;max-width:920px}.symbol,.tile,.item{background:white;border-radius:22px;padding:16px;box-shadow:0 8px 22px #0002}.symbol span,.tile span,.item span{display:block;font-size:50px}.symbol.sel{outline:5px solid #1da6e5}.primary{background:#168bd0;color:white;padding:13px 21px;border-radius:16px;font-weight:900}.primary:disabled{opacity:.35}header{position:sticky;top:0;background:#fffd;z-index:5;border-bottom:1px solid #bde4f7}.bar{max-width:1100px;margin:auto;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}.brand{background:none;color:#0875b4;font-weight:900;font-size:22px}.pill{background:#ffefa5;padding:9px 12px;border-radius:99px;font-weight:900}main{max-width:1100px;margin:auto;padding:24px 15px 45px}.hero{display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:clamp(38px,7vw,62px)}.hero em{color:#168bd0;font-style:normal}.friend{font-size:130px}.homegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.homecard,.tile{min-height:170px;border-radius:26px;color:#fff;padding:22px;text-align:left;box-shadow:0 8px 22px #0002}.homecard span{font-size:55px}.c0{background:#f25f7d}.c1{background:#f2b51e}.c2{background:#20b887}.c3{background:#28a5dd}.c4{background:#9465e7}.c5{background:#ef7b35}.c6{background:#1677c8}.c7{background:#da4e9b}.title{text-align:center}.title .ico{font-size:58px}.panel{background:#fff;border-radius:27px;padding:24px;text-align:center;box-shadow:0 8px 24px #0002}.alphabet{display:grid;grid-template-columns:.7fr 1.3fr;gap:16px}.big{font-size:140px;color:#168bd0;background:none;font-weight:900}.example{font-size:70px}.letters,.numbers{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;align-content:start}.letter,.number,.answer{aspect-ratio:1;border-radius:16px;color:#fff;font-size:29px;font-weight:900}.chosen{outline:5px solid #86d6fa;filter:brightness(.8)}.instruction{display:flex;justify-content:center;align-items:center;gap:12px}.speak{width:52px;height:52px;border-radius:50%;background:#168bd0;color:#fff;font-size:23px}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:760px;margin:22px auto}.answer{font-size:58px;border-radius:24px}.answer:disabled{opacity:.5}.feedback{margin-top:18px;padding:17px;border-radius:19px;font-size:20px;font-weight:900}.good{background:#d4f8e8;color:#08784e}.bad{background:#fff0b2;color:#966000}.mathline{font-size:clamp(38px,8vw,70px);font-weight:900;margin:20px}.objects{font-size:40px;letter-spacing:5px;line-height:1.4}.levelbar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:15px}.levelbar button{padding:10px 15px;border-radius:14px;background:#e7f5fc;font-weight:900}.levelbar .active{background:#168bd0;color:white}.slots,.wordBtns{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px}.slot{width:58px;height:68px;background:#eaf8ff;border-bottom:5px solid #68c8f2;border-radius:14px;display:grid;place-items:center;font-size:32px;font-weight:900}.wordBtn{width:62px;height:62px;border-radius:15px;color:#fff;font-size:30px;font-weight:900}.wordActions,.listenActions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px}.secondary{background:#e7f5fc;color:#086b9f;padding:12px 16px;border-radius:15px;font-weight:900}.secondary:disabled{opacity:.4}.soundTarget{font-size:72px;font-weight:900;color:#168bd0;margin:12px}.listenCard{font-size:70px;margin:15px}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:650px;margin:auto}.memory button{aspect-ratio:1;border-radius:22px;background:#8759d9;color:#fff;font-size:40px;font-weight:900}.memory .open{background:#fff;color:#7041bd}.item{text-align:center}.item button{background:#f2b51e;padding:10px;border-radius:12px;font-weight:900}.owned{background:#d4f8e8;padding:7px;border-radius:10px;font-weight:900}.collection{text-align:center;font-size:45px}.confetti{position:fixed;inset:0;pointer-events:none}.confetti i{position:absolute;top:-40px;font-size:38px;animation:f 1.7s forwards}@keyframes f{to{transform:translateY(110vh) rotate(420deg);opacity:0}}@media(max-width:760px){.symbols,.menu,.shop{grid-template-columns:repeat(2,1fr)}.homegrid{grid-template-columns:1fr}.alphabet{grid-template-columns:1fr}.friend{display:none}.letters,.numbers{grid-template-columns:repeat(5,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.memory{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="welcome" class="center"></div><div id="app" class="hide"><header><div class="bar"><button id="brand" class="brand">⭐ Letterheld</button><div><button id="home" class="primary hide">🏠</button> <span class="pill"><span id="sym">🚜</span> ⭐ <span id="stars">0</span></span></div></div></header><main id="main"></main></div><script>
const Store=(()=>{let m={},ok=false;try{localStorage.setItem('_x','1');localStorage.removeItem('_x');ok=true}catch(e){}return{get(k,d){try{if(ok)return localStorage.getItem(k)??d}catch(e){}return k in m?m[k]:d},set(k,v){try{if(ok){localStorage.setItem(k,v);return}}catch(e){}m[k]=String(v)},del(k){try{if(ok)localStorage.removeItem(k)}catch(e){}delete m[k]}}})();
const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),C=['c0','c1','c2','c3','c4','c5','c6','c7'];const SYMBOLS=[['🚜','Traktor'],['🍐','Peer'],['🦁','Leeuw'],['🦕','Dino'],['🐵','Aap'],['🚒','Brandweer'],['🚀','Raket'],['⚽','Voetbal']];const DATA=[['A','AAP','🐵'],['B','BEER','🐻'],['C','CITROEN','🍋'],['D','DINO','🦕'],['E','EEND','🦆'],['F','FIETS','🚲'],['G','GEIT','🐐'],['H','HOND','🐶'],['I','IJS','🍦'],['J','JAS','🧥'],['K','KAT','🐱'],['L','LEEUW','🦁'],['M','MUIS','🐭'],['N','NOOT','🌰'],['O','OLIFANT','🐘'],['P','PAARD','🐴'],['Q','QUICHE','🥧'],['R','ROOS','🌹'],['S','SLANG','🐍'],['T','TREIN','🚂'],['U','UIL','🦉'],['V','VIS','🐟'],['W','WOLK','☁️'],['X','XYLOFOON','🎵'],['Y','YOGHURT','🥣'],['Z','ZEBRA','🦓']].map(x=>({l:x[0],w:x[1],e:x[2]}));const WORDS=[['AAP','🐵'],['BAL','⚽'],['BUS','🚌'],['KAT','🐱'],['VIS','🐟'],['ZON','☀️'],['BEER','🐻'],['BOOT','⛵'],['EEND','🦆'],['HUIS','🏠'],['MAAN','🌙'],['MUIS','🐭'],['ROOS','🌹'],['TREIN','🚂'],['APPEL','🍎'],['FIETS','🚲'],['HOND','🐶'],['PAARD','🐴'],['SLANG','🐍'],['WOLK','☁️']].map(x=>({w:x[0],e:x[1]}));const SOUND={A:'aaaaa',B:'buh',C:'kuh',D:'duh',E:'eeeee',F:'fffff',G:'guh',H:'hhhhh',I:'iiiii',J:'jjjjj',K:'kuh',L:'lllll',M:'mmmmm',N:'nnnnn',O:'ooooo',P:'puh',Q:'kuu',R:'rrrrr',S:'sssss',T:'tuh',U:'uuuuu',V:'vvvvv',W:'weeee',X:'iks',Y:'ij',Z:'zzzzz'};const REW=[['🌈','Regenboog',5],['🎈','Ballon',8],['👑','Kroon',12],['🚀','Raket',15],['🦖','Dinoschat',20],['🏆','Trofee',25]];const PRAISES=['Goed gedaan, {name}!','Knap gewerkt, {name}!','Super hoor, {name}!','Fantastisch!','Bravo, {name}!','Wat goed!','Dat wist jij!','Mooi zo!','Topper!','Jij bent een echte Letterheld!','Geweldig gedaan!','Schitterend!','Dat gaat steeds beter!','Heel goed geluisterd!','Dat was slim bekeken!','Perfect!','Dat was helemaal juist!','Een dikke duim voor jou!','Wauw, {name}!','Dat was knap!','Sterk gedaan!','Hoera!','Prima werk!','Jij leert snel!','Dat lukt jou goed!','Dat was raak!','Heel knap!','Kampioen!','Je hebt een ster verdiend!','Nog zo eentje!'];function praise(){return PRAISES[Math.floor(Math.random()*PRAISES.length)].replace('{name}',S.name)};
let S={screen:'home',name:Store.get('name',''),symbol:JSON.parse(Store.get('symbol','null')),stars:+Store.get('stars','0'),owned:JSON.parse(Store.get('owned','[]')),round:0,selected:'E',num:0,wordLevel:3,soundLevel:'contains',feedback:null,praise:'',word:null,memory:null,current:null};const $=q=>document.querySelector(q),main=$('#main');function speak(t,slow=false){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='nl-BE';u.rate=slow?.68:.88;speechSynthesis.speak(u)}function save(){Store.set('name',S.name);Store.set('symbol',JSON.stringify(S.symbol));Store.set('stars',S.stars);Store.set('owned',JSON.stringify(S.owned));status()}function status(){$('#stars').textContent=S.stars;if(S.symbol)$('#sym').textContent=S.symbol[0];$('#home').classList.toggle('hide',S.screen==='home')}function sh(a){return[...a].sort(()=>Math.random()-.5)}function opts(x,p){return sh([x,...sh(p.filter(y=>String(y)!==String(x))).slice(0,3)])}function title(i,t,p){return`<div class="title"><div class="ico">${i}</div><h1>${t}</h1><p>${p}</p></div>`}function confetti(){let d=document.createElement('div');d.className='confetti';['⭐','✨','🎉','🌈'].forEach((x,i)=>{let z=document.createElement('i');z.textContent=x;z.style.left=(15+i*22)+'vw';z.style.animationDelay=i*.08+'s';d.append(z)});document.body.append(d);setTimeout(()=>d.remove(),1900)}
function welcome(){if(S.name&&S.symbol){$('#welcome').classList.add('hide');$('#app').classList.remove('hide');render();return}$('#welcome').classList.remove('hide');$('#app').classList.add('hide');$('#welcome').innerHTML=`<div><div style="font-size:70px">👋</div><h1>Hallo!</h1><p>Hoe heet jij?</p><input id="nm" class="name" maxlength="20" placeholder="Typ je naam" value="${S.name}"><p>Kies jouw symbool.</p><div class="symbols">${SYMBOLS.map((x,i)=>`<button data-sym="${i}" class="symbol ${S.symbol?.[1]===x[1]?'sel':''}"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div><button id="go" class="primary" ${!(S.name&&S.symbol)?'disabled':''}>Start mijn avontuur</button></div>`}function render(){status();main.innerHTML=page();if(['listen','case','numberListen','math','soundContains','soundFind','soundStart'].includes(S.screen)&&!S.feedback)setTimeout(()=>speak(S.current.say,true),250)}function page(){let f={home,alphabet,games,numbers,numberLearn,numberListen,math,words,wordBuild,wordPick,sounds,soundContains,soundFind,soundStart,memory,shop};return(f[S.screen]||home)()}
function home(){return`<div class="hero"><h1>Hallo ${S.name}! Word jij een <em>Letterheld?</em></h1><div class="friend">${S.symbol[0]}</div></div><div class="homegrid">${[['alphabet','🔤','Letters','c3'],['numbers','🔢','Cijfers & rekenen','c1'],['words','🧩','Woorden','c2'],['shop','🎁','Sterrenwinkel','c5']].map(x=>`<button data-screen="${x[0]}" class="homecard ${x[3]}"><span>${x[1]}</span><h2>${x[2]}</h2></button>`).join('')}</div>`}function alphabet(){let x=DATA.find(d=>d.l===S.selected);return title('🔤','Ontdek letters','Klik op de grote letter voor de klank.')+`<div class="alphabet"><div class="panel"><button class="big" data-act="sound">${x.l}</button><div class="example">${x.e}</div><h2>${x.w.toLowerCase()}</h2><button class="primary" data-act="example">🔊 Dit is de ${x.l} van ${x.w.toLowerCase()}</button></div><div class="letters">${L.map((l,i)=>`<button data-letter="${l}" class="letter ${C[i%8]} ${l===S.selected?'chosen':''}">${l}</button>`).join('')}</div></div>`}function games(){return home()}
function numbers(){return title('🔢','Cijfers & rekenen','Kies wat je wilt oefenen.')+`<div class="menu">${[['numberLearn','🔟','Cijfers leren'],['numberListen','👂','Luister naar een cijfer'],['math','➕','Optellen en aftrekken']].map((x,i)=>`<button data-screen="${x[0]}" class="tile ${C[i+1]}"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div>`}function numberLearn(){let n=S.num;return title('🔟','Cijfers leren','Tik op een cijfer om het te horen.')+`<div class="alphabet"><div class="panel"><button class="big" data-act="numberSay">${n}</button><div class="objects">${n?Array(n).fill('⭐').join(' '):'∅'}</div><h2>${['nul','één','twee','drie','vier','vijf','zes','zeven','acht','negen','tien'][n]}</h2></div><div class="numbers">${Array.from({length:11},(_,i)=>`<button data-num="${i}" class="number ${C[i%8]} ${i===n?'chosen':''}">${i}</button>`).join('')}</div></div>`}function numberListen(){let n=(S.round*3+2)%11;S.current={target:String(n),say:'Tik op het cijfer '+n};return shell('👂','Luister naar een cijfer','Welk cijfer hoor je?',opts(String(n),Array.from({length:11},(_,i)=>String(i))).map((v,i)=>ans(v,i)).join(''))}function math(){let max=5+(S.round%2)*5,a=(S.round*3+2)%(max+1),add=S.round%2===0,b=add?(S.round*2+1)%(max-a+1):(S.round*2+1)%(a+1),result=add?a+b:a-b,symbol=S.round%3!==1,icon=['🍎','⭐','🚜'][S.round%3];S.current={target:String(result),say:(add?'Hoeveel is '+a+' plus '+b:'Hoeveel is '+a+' min '+b)};let visual=symbol?`<div class="objects">${Array(a).fill(icon).join(' ')} ${add?'+':'−'} ${Array(b).fill(icon).join(' ')||'∅'}</div>`:'';return title('➕','Eenvoudig rekenen','Tel rustig en kies het antwoord.')+`<div class="panel">${visual}<div class="mathline">${a} ${add?'+':'−'} ${b} = ?</div><button data-act="repeat" class="speak">🔊</button><div class="answers">${opts(String(result),Array.from({length:11},(_,i)=>String(i))).map((v,i)=>ans(v,i)).join('')}</div>${feed()}</div>`}
function words(){return title('🧩','Woorden en klanken','Kies de lengte en een oefening.')+`<div class="levelbar">${[3,4,5].map(n=>`<button data-level="${n}" class="${S.wordLevel===n?'active':''}">${n} letters</button>`).join('')}</div><div class="menu"><button data-screen="wordBuild" class="tile c2"><span>🧩</span><b>Bouw het woord</b></button><button data-screen="wordPick" class="tile c4"><span>🔎</span><b>Zoek het woord</b></button><button data-screen="sounds" class="tile c7"><span>👂</span><b>Klanken in woorden</b></button></div>`}function currentWord(){let list=WORDS.filter(x=>x.w.length===S.wordLevel);return list[S.round%list.length]}function wordBuild(){let x=currentWord();if(!S.word||S.word.x.w!==x.w)S.word={x,p:[],b:sh(x.w.split('').map((l,i)=>({l,i})))};return title('🧩','Bouw een woord van '+S.wordLevel+' letters','Tik de letters in de juiste volgorde. Je kunt altijd verbeteren.')+`<div class="panel"><div class="example">${x.e}</div><button data-act="wordSay" class="speak">🔊</button><div class="slots">${x.w.split('').map((_,i)=>`<div class="slot">${S.word.p[i]?.l||''}</div>`).join('')}</div><div class="wordBtns">${S.word.b.map((b,i)=>`<button data-wid="${b.i}" class="wordBtn ${C[i%8]}" ${S.word.p.some(p=>p.i===b.i)||S.feedback==='good'?'disabled':''}>${b.l}</button>`).join('')}</div><div class="wordActions"><button data-act="wordUndo" class="secondary" ${!S.word.p.length||S.feedback==='good'?'disabled':''}>↶ Laatste letter weg</button><button data-act="wordReset" class="secondary" ${!S.word.p.length||S.feedback==='good'?'disabled':''}>↺ Opnieuw beginnen</button><button data-act="wordSay" class="secondary">🔊 Luister opnieuw</button></div>${feed()}</div>`}
function wordPick(){let x=currentWord(),pool=WORDS.filter(w=>w.w.length===S.wordLevel).map(w=>w.w);S.current={target:x.w,say:'Waar staat het woord '+x.w.toLowerCase()};return shell('🔎','Zoek het woord',`Welk woord hoort bij ${x.e}?`,opts(x.w,pool).map((v,i)=>ans(v,i)).join(''))}

function sounds(){return title('👂','Klanken in woorden','Luister goed en ontdek waar een klank zit.')+`<div class="menu"><button data-screen="soundContains" class="tile c0"><span>✅</span><b>Hoor je de klank?</b></button><button data-screen="soundFind" class="tile c3"><span>🔎</span><b>Waar hoor je de klank?</b></button><button data-screen="soundStart" class="tile c5"><span>🔤</span><b>Welke beginletter?</b></button></div>`}
function soundWords(){return WORDS.filter(x=>x.w.length>=3&&x.w.length<=4)}
function soundContains(){let pool=soundWords(),x=pool[S.round%pool.length],letters=['A','E','I','O','U','M','S','K','B','P'],has=S.round%2===0,letter;if(has){letter=sh([...new Set(x.w.split(''))].filter(c=>letters.includes(c)))[0]||x.w[0]}else{letter=letters.find(c=>!x.w.includes(c))||'Z'}S.current={target:has?'JA':'NEE',say:`Hoor je de ${letter} in ${x.w.toLowerCase()}?`,letterSound:SOUND[letter]||letter,wordSay:x.w.toLowerCase()};return title('✅','Hoor je de klank?','Luister goed. Het woord staat niet in beeld.')+`<div class="panel"><div class="listenCard">👂</div><div class="soundTarget">Klank ${letter}</div><div class="listenActions"><button data-act="listenSound" class="secondary">🔊 Hoor de klank</button><button data-act="listenWord" class="secondary">🔊 Hoor het woord</button><button data-act="repeat" class="secondary">🔁 Hoor de hele vraag</button></div><div class="answers"><button data-answer="JA" class="answer c2" ${S.feedback?'disabled':''}>JA</button><button data-answer="NEE" class="answer c0" ${S.feedback?'disabled':''}>NEE</button></div>${feed()}</div>`}
function soundFind(){let pool=soundWords(),target=pool[S.round%pool.length],letter=target.w[(S.round*2)%target.w.length],others=sh(pool.filter(x=>x.w!==target.w&&!x.w.includes(letter))).slice(0,3),choices=sh([target,...others]);S.current={target:target.w,say:`Waar hoor je de ${letter}?`};return title('🔎','Waar hoor je de klank?','Kies het woord waarin je de klank hoort.')+`<div class="panel"><div class="mathline">Klank: ${letter}</div><button data-act="repeat" class="speak">🔊</button><div class="answers">${choices.map((x,i)=>ans(`${x.e}<br><small>${x.w}</small>`,i,x.w)).join('')}</div>${feed()}</div>`}
function soundStart(){let pool=soundWords(),target=pool[S.round%pool.length],letter=target.w[0],others=sh(pool.filter(x=>x.w[0]!==letter)).slice(0,3),choices=sh([target,...others]);S.current={target:target.w,say:`Welk woord begint met de ${letter}?`};return title('🔤','Welke beginletter?','Kies het woord dat met de gevraagde klank begint.')+`<div class="panel"><div class="mathline">Begint met: ${letter}</div><button data-act="repeat" class="speak">🔊</button><div class="answers">${choices.map((x,i)=>ans(`${x.e}<br><small>${x.w}</small>`,i,x.w)).join('')}</div>${feed()}</div>`}
function shell(i,t,q,a){return title(i,t,'Een goed antwoord verdient een ster.')+`<div class="panel"><div class="instruction"><h2>${q}</h2><button data-act="repeat" class="speak">🔊</button></div><div class="answers">${a}</div>${feed()}</div>`}function ans(x,i,id=x){return`<button data-answer="${id}" class="answer ${C[i%8]}" ${S.feedback?'disabled':''}>${x}</button>`}function initMem(){let b=['A','B','K','M','S','V'];S.memory={c:sh([...b,...b].map((l,i)=>({l,i}))),o:[],d:[],busy:false,won:false}}function memory(){if(!S.memory)initMem();let m=S.memory;return title('🧠','Lettermemory','Zoek twee dezelfde letters.')+`<div class="memory">${m.c.map(x=>{let o=m.o.includes(x.i)||m.d.includes(x.i);return`<button data-mid="${x.i}" class="${o?'open':''}">${o?x.l:'★'}</button>`}).join('')}</div>`}function shop(){return title('🎁',S.name+"'s sterrenwinkel",'Wissel sterren in voor iets leuks.')+(S.owned.length?`<div class="collection">${S.owned.map(i=>REW[i][0]).join(' ')}</div>`:'')+`<div class="shop">${REW.map((r,i)=>`<div class="item"><span>${r[0]}</span><h3>${r[1]}</h3><p>⭐ ${r[2]}</p>${S.owned.includes(i)?'<b class="owned">Verzameld!</b>':`<button data-buy="${i}" ${S.stars<r[2]?'disabled':''}>Omwisselen</button>`}</div>`).join('')}</div>`}function feed(){if(!S.feedback)return'';if(S.feedback==='wordBad')return`<div class="feedback bad">❌ Bijna, ${S.name}. Verwijder een letter of begin opnieuw.</div>`;return`<div class="feedback ${S.feedback==='good'?'good':'bad'}">${S.feedback==='good'?'✅ '+S.praise+' +1 ster':'❌ Bijna, '+S.name+'!'}<br><button data-act="next" class="primary">Volgende</button></div>`}function reward(){S.stars++;S.feedback='good';S.praise=praise();save();speak(S.praise);confetti();render()}function miss(){S.feedback='bad';S.praise='';speak('Bijna '+S.name+'. Probeer nog eens.');render()}
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value.trim();$('#go').disabled=!(S.name&&S.symbol)}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.sym!==undefined){S.symbol=SYMBOLS[+b.dataset.sym];S.name=$('#nm').value.trim();welcome();return}if(b.id==='go'){if(!S.symbol)return;S.name=$('#nm').value.trim()||'Letterheld';save();welcome();return}if(b.dataset.screen){S.screen=b.dataset.screen;S.feedback=null;S.word=null;render();return}if(b.dataset.level){S.wordLevel=+b.dataset.level;S.word=null;render();return}if(b.dataset.letter){S.selected=b.dataset.letter;let x=DATA.find(d=>d.l===S.selected);speak('Dit is de '+x.l+' van '+x.w.toLowerCase(),true);render();return}if(b.dataset.num!==undefined){S.num=+b.dataset.num;speak(['nul','één','twee','drie','vier','vijf','zes','zeven','acht','negen','tien'][S.num]);render();return}if(b.dataset.answer!==undefined){String(b.dataset.answer)===String(S.current.target)?reward():miss();return}if(b.dataset.wid!==undefined){if(S.feedback==='good')return;let x=S.word.b.find(q=>q.i===+b.dataset.wid);if(!x||S.word.p.some(q=>q.i===x.i))return;S.word.p.push(x);if(S.word.p.length===S.word.x.w.length){if(S.word.p.map(q=>q.l).join('')===S.word.x.w)reward();else{S.feedback='wordBad';S.praise='';speak('Bijna '+S.name+'. Je kunt de laatste letter weghalen of opnieuw beginnen.');render()}}else render();return}if(b.dataset.buy!==undefined){let i=+b.dataset.buy,r=REW[i];if(S.stars>=r[2]){S.stars-=r[2];S.owned.push(i);save();confetti();render()}return}switch(b.dataset.act){case'sound':speak(SOUND[S.selected],true);break;case'example':{let x=DATA.find(d=>d.l===S.selected);speak('Dit is de '+x.l+' van '+x.w.toLowerCase(),true);break}case'numberSay':speak(['nul','één','twee','drie','vier','vijf','zes','zeven','acht','negen','tien'][S.num]);break;case'repeat':speak(S.current.say,true);break;case'listenSound':speak(S.current.letterSound,true);break;case'listenWord':speak(S.current.wordSay,true);break;case'wordSay':speak(S.word.x.w);break;case'wordUndo':if(S.word&&S.word.p.length){S.word.p.pop();S.feedback=null;S.praise='';render()}break;case'wordReset':if(S.word){S.word.p=[];S.feedback=null;S.praise='';render()}break;case'next':S.round++;S.feedback=null;S.praise='';S.word=null;render();break}});$('#brand').onclick=$('#home').onclick=()=>{S.screen='home';S.feedback=null;render()};welcome();
</script></body></html>
